name: Build Buffalo WXR-6000AX12S / WXR-5950AX12 – NSS Auto Fallback

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Ho_Chi_Minh
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  MAKEFLAGS: "-j$(nproc)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: 1️⃣ Checkout code
        uses: actions/checkout@v4

      - name: 2️⃣ Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip wget zlib1g-dev file ccache xsltproc qemu-utils aria2 ca-certificates
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: 3️⃣ Clone LiBwrt NSS
        run: git clone --depth 1 -b main-nss https://github.com/LiBwrt/openwrt-6.x openwrt

      - name: 4️⃣ Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: buffalo-wxr6000-nss-autofallback-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buffalo-wxr6000-nss-autofallback-${{ runner.os }}-

      - name: 5️⃣ Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6️⃣ Configure .config with Auto Fallback
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config

          # Tìm WXR-6000AX12S
          REAL_ID=$(grep -RhoP 'DEVICE_buffalo_wxr[-_]6000ax12s' target/linux/qualcommax/image/ | head -n1)
          
          if [ -z "$REAL_ID" ]; then
             echo "⚠️ Không tìm thấy symbol WXR-6000AX12S, fallback sang WXR-5950AX12"
             # Đã thêm tiền tố DEVICE_buffalo_ cho đúng chuẩn
             REAL_ID_SAFE="DEVICE_buffalo_wxr_5950ax12"
          else
             REAL_ID_SAFE=$(echo "$REAL_ID" | tr '-' '_')
             echo "✅ Symbol được chọn: $REAL_ID_SAFE"
          fi

          echo "CONFIG_TARGET_qualcommax_ipq807x_${REAL_ID_SAFE}=y" >> .config

          # FIX YAML SYNTAX: Thụt lề toàn bộ nội dung bên trong heredoc
          cat >> .config <<'EOF'
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_IMAGE_METADATA=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          CONFIG_PACKAGE_kmod-qca-nss-crypto=y
          CONFIG_PACKAGE_kmod-qca-nss-cfi=y
          CONFIG_PACKAGE_nss-tools=y
          CONFIG_NSS_PPP_SUPPORT=y
          CONFIG_ECM_INTERFACE_PPP_ENABLE=y
          CONFIG_ECM_INTERFACE_VLAN_ENABLE=y
          CONFIG_PACKAGE_kmod-phy-aquantia=y
          CONFIG_PACKAGE_ath11k-firmware-ipq8074=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-8021q=y
          CONFIG_PACKAGE_ethtool-full=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_htop=y
          EOF

          make defconfig || (echo "⚠️ Defconfig warning ignored" && true)

      - name: 7️⃣ Download packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 8️⃣ Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) IGNORE_ERRORS=m || make -j1 V=s

      - name: 9️⃣ SHA256 Guard
        id: sha_guard
        run: |
          cd openwrt/bin/targets/qualcommax/ipq807x
          SYS=$(ls *sysupgrade.bin | head -n1)
          INIT=$(ls *initramfs-kernel.bin | head -n1)
          SHA_SYS=$(sha256sum "$SYS" | awk '{print $1}')
          SHA_INIT=$(sha256sum "$INIT" | awk '{print $1}')
          echo "SHA_SYS=$SHA_SYS" >> $GITHUB_ENV
          echo "SHA_INIT=$SHA_INIT" >> $GITHUB_ENV
          echo "$SHA_SYS  $SYS" > sha256sums
          echo "$SHA_INIT  $INIT" >> sha256sums

      - name: 🔟 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buffalo-WXR6000-NSS-AutoFallback-${{ env.SHA_SYS }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq807x/*initramfs-kernel.bin
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
