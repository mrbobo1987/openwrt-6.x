name: Build Buffalo WXR-6000AX12S (GOD TIER)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Ho_Chi_Minh
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  MAKEFLAGS: "-j$(nproc)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip wget zlib1g-dev file ccache xsltproc qemu-utils aria2 ca-certificates
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Clone LiBwrt NSS
        run: git clone --depth 1 -b main-nss https://github.com/LiBwrt/openwrt-6.x openwrt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: buffalo-wxr6000-nss-god-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buffalo-wxr6000-nss-god-${{ runner.os }}-

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure .config (GOD Tier)
        run: |
          cd openwrt
          rm -f .config

          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config

          # Auto detect WXR-6000AX12S symbol
          REAL_ID=$(grep -RhoP 'DEVICE_buffalo_wxr[-_]6000ax12s' target/linux/qualcommax/ | head -n1)
          if [ -z "$REAL_ID" ]; then
            echo "⚠️ Không tìm thấy symbol WXR-6000AX12S, fallback WXR-5950AX12"
            REAL_ID_SAFE=wxr_5950ax12
          else
            REAL_ID_SAFE=$(echo "$REAL_ID" | tr '-' '_')
            echo "✅ Symbol xác định: $REAL_ID_SAFE"
          fi
          echo "CONFIG_TARGET_qualcommax_ipq807x_${REAL_ID_SAFE}=y" >> .config

          # Thêm config core & NSS
          cat >> .config <<'EOF'
CONFIG_TARGET_ROOTFS_SQUASHFS=y
CONFIG_IMAGE_METADATA=y
CONFIG_CCACHE=y

# NSS Full Stack + PPPoE + VLAN
CONFIG_PACKAGE_kmod-qca-nss-drv=y
CONFIG_PACKAGE_kmod-qca-nss-ecm=y
CONFIG_PACKAGE_kmod-qca-nss-crypto=y
CONFIG_PACKAGE_kmod-qca-nss-cfi=y
CONFIG_PACKAGE_nss-tools=y
CONFIG_NSS_PPP_SUPPORT=y
CONFIG_ECM_INTERFACE_PPP_ENABLE=y
CONFIG_ECM_INTERFACE_VLAN_ENABLE=y

# Drivers & networking
CONFIG_PACKAGE_kmod-phy-aquantia=y
CONFIG_PACKAGE_ath11k-firmware-ipq8074=y
CONFIG_PACKAGE_ppp=y
CONFIG_PACKAGE_kmod-ppp=y
CONFIG_PACKAGE_ppp-mod-pppoe=y
CONFIG_PACKAGE_ppp-mod-pppol2tp=y
CONFIG_PACKAGE_kmod-8021q=y
CONFIG_PACKAGE_ethtool-full=y
CONFIG_PACKAGE_ip-full=y

# LuCI & Tiếng Việt
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-i18n-base-vi=y
CONFIG_PACKAGE_luci-theme-argon=y

# Apps & monitoring
CONFIG_PACKAGE_luci-app-nlbwmon=y
CONFIG_PACKAGE_luci-app-samba4=y
CONFIG_PACKAGE_luci-app-filebrowser=y
CONFIG_PACKAGE_htop=y

# VLAN profiles VN (VNPT/Viettel/FPT)
CONFIG_PACKAGE_luci-app-vlanwizard=y
CONFIG_PACKAGE_luci-profiles-vn=y
EOF

          # Chạy defconfig mà không fail nếu target bị xóa
          make defconfig || (echo "❌ defconfig lỗi, build tiếp tục..." && true)

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) IGNORE_ERRORS=m || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buffalo-WXR6000-GOD
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq807x/*initramfs-kernel.bin
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
