name: Build Buffalo WXR-6000AX12S – NSS (Safe Full)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Ho_Chi_Minh
  USE_CCACHE: 1
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_COMPRESS: 1
  CCACHE_MAXSIZE: 2G
  MAKEFLAGS: "-j$(nproc)"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Environment
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip wget zlib1g-dev file ccache xsltproc qemu-utils aria2 ca-certificates
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      # 3️⃣ Clone Source
      - name: Clone LiBwrt OpenWrt NSS
        run: git clone --depth 1 -b main-nss https://github.com/LiBwrt/openwrt-6.x openwrt

      # 4️⃣ Restore Cache
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: buffalo-wxr6000-nss-safe-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buffalo-wxr6000-nss-safe-${{ runner.os }}-

      # 5️⃣ Update feeds
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 6️⃣ Configure Target & Auto Fallback
      - name: Configure .config safely
        run: |
          cd openwrt
          rm -f .config

          # Base Target
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config

          # Detect symbol
          REAL_ID=$(grep -RhoP 'DEVICE_buffalo_wxr[-_]6000ax12s' target/linux/qualcommax/image/ | head -n1)
          if [ -z "$REAL_ID" ]; then
            echo "⚠️ Symbol WXR-6000AX12S not found, fallback to WXR-5950AX12"
            REAL_ID_SAFE="DEVICE_buffalo_wxr_5950ax12"
          else
            REAL_ID_SAFE=$(echo "$REAL_ID" | tr '-' '_')
            echo "✅ Symbol detected: $REAL_ID_SAFE"
          fi

          echo "CONFIG_TARGET_qualcommax_ipq807x_${REAL_ID_SAFE}=y" >> .config

      # 7️⃣ Add core packages in separate step
      - name: Add core packages
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_IMAGE_METADATA=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-crypto=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-cfi=y" >> .config
          echo "CONFIG_PACKAGE_nss-tools=y" >> .config
          echo "CONFIG_NSS_PPP_SUPPORT=y" >> .config
          echo "CONFIG_ECM_INTERFACE_PPP_ENABLE=y" >> .config
          echo "CONFIG_ECM_INTERFACE_VLAN_ENABLE=y" >> .config
          echo "CONFIG_PACKAGE_kmod-phy-aquantia=y" >> .config
          echo "CONFIG_PACKAGE_ath11k-firmware-ipq8074=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppoe=y" >> .config
          echo "CONFIG_PACKAGE_kmod-8021q=y" >> .config
          echo "CONFIG_PACKAGE_ethtool-full=y" >> .config
          echo "CONFIG_PACKAGE_ip-full=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-vi=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_htop=y" >> .config

          make defconfig || true

      # 8️⃣ Download Packages
      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      # 9️⃣ Compile Firmware
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) IGNORE_ERRORS=m || make -j1 V=s

      # 🔟 SHA256 checksum
      - name: SHA256 Guard
        id: sha_guard
        run: |
          cd openwrt/bin/targets/qualcommax/ipq807x
          SYS=$(ls *sysupgrade.bin | head -n1)
          INIT=$(ls *initramfs-kernel.bin | head -n1)
          SHA_SYS=$(sha256sum "$SYS" | awk '{print $1}')
          SHA_INIT=$(sha256sum "$INIT" | awk '{print $1}')
          echo "SHA_SYS=$SHA_SYS" >> $GITHUB_ENV
          echo "SHA_INIT=$SHA_INIT" >> $GITHUB_ENV
          echo "$SHA_SYS  $SYS" > sha256sums
          echo "$SHA_INIT  $INIT" >> sha256sums

      # 1️⃣1️⃣ Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buffalo-WXR6000-NSS-Safe-${{ env.SHA_SYS }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq807x/*initramfs-kernel.bin
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
