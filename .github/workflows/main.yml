name: Buffalo 6000AX12S - Final Qosmio Optimized
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone Source
        run: git clone -b main-nss --single-branch https://github.com/qosmio/openwrt-ipq.git openwrt

      - name: Feeds Setup
        run: |
          cd openwrt
          cat > feeds.conf.default <<EOF
          src-git packages https://git.openwrt.org/feed/packages.git;master
          src-git luci https://git.openwrt.org/project/luci.git;master
          src-git routing https://git.openwrt.org/feed/routing.git;master
          src-git telephony https://git.openwrt.org/feed/telephony.git;master
          src-git nss_packages https://github.com/qosmio/nss-packages.git;NSS-12.5-K6.x
          src-git sqm_scripts_nss https://github.com/qosmio/sqm-scripts-nss.git
          EOF
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Configuration
        run: |
          cd openwrt
          cp nss-setup/config-nss.seed .config
          
          # Thiet lap muc tieu phan cung
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_buffalo_wxr-5950ax12=y" >> .config
          
          # Driver 10G va Firmware Aquantia
          echo "CONFIG_PACKAGE_kmod-phy-aquantia=y" >> .config
          echo "CONFIG_PACKAGE_aquantia-firmware-aqr113c=y" >> .config
          
          # WiFi va He thong
          echo "CONFIG_PACKAGE_ath11k-firmware-ipq8074=y" >> .config
          echo "CONFIG_PACKAGE_wpad-openssl=y" >> .config
          echo "CONFIG_PACKAGE_irqbalance=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
          
          # Giao dien Luci va Tieng Viet
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-vi=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-cpufreq=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          # Thong ke va Nhiet do
          echo "CONFIG_PACKAGE_luci-app-statistics=y" >> .config
          echo "CONFIG_PACKAGE_collectd-mod-thermal=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-statistics-vi=y" >> .config

          # Toi uu hoa NSS (Tat cac bo loc gay xung dot)
          echo "# CONFIG_PACKAGE_kmod-ipt-offload is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-nft-offload is not set" >> .config
          echo "# CONFIG_PACKAGE_kmod-shortcut-fe is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-app-turboacc is not set" >> .config
          
          make defconfig

      - name: Download and Build
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buffalo-6000AX12S-Final-Firmware
          path: openwrt/bin/targets/qualcommax/ipq807x/*sysupgrade.bin
